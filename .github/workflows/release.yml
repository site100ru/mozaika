name: Build Release

on:
  release:
    types: [published]  # или [created] - на ваше усмотрение

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build theme ZIP
        run: |
          git archive --format=zip --output=mozaika.zip HEAD
          echo "✅ Archive created: $(ls -lh mozaika.zip)"

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2  # Используем более надежный action
        with:
          files: mozaika.zip
          token: ${{ secrets.RELEASE_TOKEN }}   # 👈 ГЛАВНОЕ: используем PAT