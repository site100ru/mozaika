name: Build Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build theme ZIP
        run: |
          git archive --format=zip --output=mozaika.zip HEAD

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: mozaika.zip
          token: ${{ secrets.RELEASE_TOKEN }}